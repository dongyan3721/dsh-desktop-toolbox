name: Unified bundle Windows validation
on:
  push:
    branches: [codex/unified-beta8]
  workflow_dispatch:
    inputs:
      bundle_ref:
        description: 'Public complete bundle GitHub commit/tag or release tgz URL (installation-only job)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name == 'push' || inputs.bundle_ref == ''
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Prepare workspace tools
        run: |
          . ./scripts/Use-ProjectEnvironment.ps1
          npm install --prefix .tmp/ci-tools --no-audit --no-fund pnpm@11.28.5
          if ($LASTEXITCODE -ne 0) { throw 'pnpm tool preparation failed' }
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: rust-cache
        with:
          path: |
            .tmp/cargo-home
            build/rust/target
            build/rust/intermediates
          key: windows-native-v1-${{ hashFiles('native/YourAllIn1Helper/Cargo.lock') }}
      - name: Build original UI and native programs
        run: |
          . ./scripts/Use-ProjectEnvironment.ps1
          & ./.tmp/ci-tools/node_modules/.bin/pnpm.cmd --dir native/YourAllIn1Helper/src-ui install --frozen-lockfile --store-dir "$PWD/.tmp/pnpm-store"
          if ($LASTEXITCODE -ne 0) { throw 'UI dependency preparation failed' }
          & ./.tmp/ci-tools/node_modules/.bin/pnpm.cmd --dir native/YourAllIn1Helper/src-ui run build
          if ($LASTEXITCODE -ne 0) { throw 'UI build failed' }
          rustc -Vv | Tee-Object artifacts/windows-toolchain.log
          cargo fetch --manifest-path native/YourAllIn1Helper/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'Locked Rust dependency preparation failed' }
          cargo build --manifest-path native/YourAllIn1Helper/Cargo.toml -p all-in-one-host --bin all-in-one-desktop --features tauri/custom-protocol --release --locked --offline -j2
          if ($LASTEXITCODE -ne 0) { throw 'Windows desktop build failed' }
          cargo build --manifest-path native/YourAllIn1Helper/Cargo.toml -p dsh-bridge --bin dsh-toolbox-native --release --locked --offline -j2
          if ($LASTEXITCODE -ne 0) { throw 'Historical protocol fixture build failed' }
          node scripts/bundle-desktop.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop manifest failed' }
          node scripts/bundle-native.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Protocol fixture manifest failed' }
          node scripts/build.mjs
      - name: Native regression tests
        run: |
          . ./scripts/Use-ProjectEnvironment.ps1
          cargo test --manifest-path native/YourAllIn1Helper/Cargo.toml -p app-core -p dsh-bridge -p os-hal -p mod-screen-ink -p mod-screenshot -p all-in-one-host --lib --release --locked --offline -j2
          if ($LASTEXITCODE -ne 0) { throw 'Windows native regression failed' }
      - name: Prepare official Harness SDK (files only)
        run: ./scripts/prepare-harness-windows.ps1
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .tmp/cargo-home
            build/rust/target
            build/rust/intermediates
          key: windows-native-v1-${{ hashFiles('native/YourAllIn1Helper/Cargo.lock') }}
      - name: Actual SDK regression tests
        run: |
          . ./scripts/Use-ProjectEnvironment.ps1
          node --test tests/*.test.mjs packages/dsh-toolbox/tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows SDK regression failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-current-native
          path: |
            packages/dsh-toolbox/resources/win32-x64/
            packages/dsh-toolbox/resources/desktop-manifest.json
            packages/dsh-toolbox/resources/native-manifest.json
            artifacts/
          if-no-files-found: error

  installed-bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.bundle_ref != ''
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Prepare official Harness SDK (files only)
        run: ./scripts/prepare-harness-windows.ps1
      - name: Accept the public complete bundle
        env:
          TOOLBOX_BUNDLE_REF: ${{ inputs.bundle_ref }}
        run: ./scripts/accept-unified-windows.ps1 -BundleRef $env:TOOLBOX_BUNDLE_REF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-installed-bundle
          path: artifacts/
          if-no-files-found: error
