# H1 staging composition. Install dsh-toolbox-client separately for its visible entry.
# Does not register model tools; do not combine with the legacy headless Bundle
# against the same data directory.
- insert:
    - id: toolbox-desktop
      name: dsh-toolbox/desktop
      config:
        dataDir: !!js >-
          process.env.DSH_TOOLBOX_DATA_DIR || (process.env.DSH_HOME ? process.env.DSH_HOME + '/toolbox-desktop-data' : '')
