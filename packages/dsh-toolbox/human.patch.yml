# One human desktop kernel. Agent tools remain absent until explicitly granted.
# Install dsh-toolbox-client separately for the visible human entry.
- insert:
    - id: toolbox-desktop
      name: dsh-toolbox/desktop
      config:
        dataDir: !!js >-
          process.env.DSH_TOOLBOX_DATA_DIR || (process.env.DSH_HOME ? process.env.DSH_HOME + '/toolbox-desktop-data' : '')
    - id: toolbox-agent
      name: dsh-toolbox/agent
